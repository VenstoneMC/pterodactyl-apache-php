# Configuration Apache chargée en dernier (conf-enabled/zz-venstone.conf).
# Les ${VAR} sont lues dans l'environnement au démarrage (variables Pterodactyl).

Listen ${SERVER_PORT}
ServerName localhost

# Ne rien révéler sur le serveur
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Erreurs Apache dans la console Pterodactyl, accès dans logs/ avec rotation (5 x 10 Mo)
ErrorLog /proc/self/fd/2
# mpm_prefork:notice affiche "resuming normal operations" (détection du démarrage par Pterodactyl)
LogLevel warn mpm_prefork:notice
LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" venstone
CustomLog "|/usr/bin/rotatelogs -n 5 ${APACHE_LOG_DIR}/access.log 10M" venstone

# Interdit tout le système de fichiers par défaut
<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>

<VirtualHost *:${SERVER_PORT}>
    DocumentRoot ${DOCUMENT_ROOT}

    <Directory ${DOCUMENT_ROOT}>
        Options FollowSymLinks
        # Le public/.htaccess de Symfony (apache-pack) gère la réécriture
        AllowOverride All
        Require all granted
    </Directory>

    # Fichiers cachés (.env, .git, .htpasswd...) jamais servis
    <FilesMatch "^\.(?!well-known)">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header unset X-Powered-By
</VirtualHost>
