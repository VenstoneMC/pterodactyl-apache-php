; Surcharges de production (base : php.ini-production).
; Pour changer une valeur sans reconstruire l'image : créer un fichier .ini
; dans /home/container/php/ (dossier "php" du gestionnaire de fichiers).

; Ne pas annoncer la version de PHP
expose_php = Off

; Erreurs : jamais affichées aux visiteurs, envoyées dans le log Apache (console)
display_errors = Off
display_startup_errors = Off
log_errors = On

memory_limit = 256M
max_execution_time = 60
; Envois de skins / galerie / radio
upload_max_filesize = 40M
post_max_size = 50M
max_file_uploads = 10

; Pas d'inclusion de fichiers distants
allow_url_include = Off

; Sessions persistantes (le /tmp de Pterodactyl est vidé à chaque redémarrage)
session.save_path = "/home/container/tmp/sessions"
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; OPcache (recommandations Symfony). validate_timestamps reste actif pour que
; les fichiers mis à jour par git pull soient pris en compte sans redémarrer.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; APCu (utilisable par le cache Symfony)
apc.enable_cli = 0
apc.shm_size = 64M
