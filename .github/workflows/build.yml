name: Build image

# Reconstruite chaque semaine (et à la main) pour récupérer les correctifs
# de sécurité PHP / Debian publiés dans l'image officielle php:*-apache.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nom de l'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: PHP_VERSION=${{ matrix.php }}
          pull: true
          no-cache: true
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.php }}

      - name: Vérification rapide
        run: |
          docker run --rm --entrypoint php "$IMAGE:${{ matrix.php }}" -v
          docker run --rm --entrypoint php "$IMAGE:${{ matrix.php }}" -m | grep -Eiw 'gd|intl|pdo_sqlite|mbstring|apcu|Zend OPcache'
